<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SurplusOS — B2B Industrial Liquidation Agent</title>
  <style>
    :root {
      --bg-wallpaper: radial-gradient(circle at 15% 15%, #1e293b 0%, #0f172a 55%, #020617 100%);
      --glass-surface: rgba(30, 41, 59, 0.62);
      --glass-sidebar: rgba(15, 23, 42, 0.72);
      --glass-card: rgba(255, 255, 255, 0.045);
      --glass-card-hover: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.11);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-blue: #0a84ff;
      --accent-green: #30d158;
      --accent-amber: #ffd60a;
      --accent-purple: #bf5af2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg-wallpaper);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    /* macOS Window Frame */
    .macos-window {
      width: 100%;
      max-width: 1440px;
      height: calc(100vh - 36px);
      background: var(--glass-surface);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
      display: grid;
      grid-template-columns: 270px 1fr;
      overflow: hidden;
    }

    /* Left Vibrancy Sidebar */
    .sidebar {
      background: var(--glass-sidebar);
      border-right: 1px solid var(--glass-border);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
      padding: 4px 8px 20px 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.red { background: #ff5f57; }
    .dot.yellow { background: #febc2e; }
    .dot.green { background: #28c840; }

    .sidebar-section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      padding: 8px 10px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-item.active {
      background: var(--accent-blue);
      color: #ffffff;
    }

    .telemetry-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 14px;
      font-size: 12px;
      line-height: 1.6;
    }

    .pulse-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--accent-green);
      margin-bottom: 6px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
    }

    /* Main Content Area */
    .main-view {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .topbar {
      padding: 16px 24px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .search-group {
      display: flex;
      gap: 10px;
      flex: 1;
      max-width: 720px;
    }

    .macos-input {
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      width: 100%;
      outline: none;
    }

    .macos-input:focus {
      border-color: var(--accent-blue);
    }

    .macos-btn {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .macos-btn:hover {
      opacity: 0.92;
    }

    /* Catalog Grid */
    .catalog-container {
      padding: 20px 24px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 14px;
      align-content: start;
    }

    .deal-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .deal-card:hover {
      background: var(--glass-card-hover);
      transform: translateY(-2px);
    }

    .badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.03em;
    }

    .badge.AUCTION_LOT { background: rgba(255, 214, 10, 0.18); color: var(--accent-amber); }
    .badge.BUYER_LEAD { background: rgba(48, 209, 88, 0.18); color: var(--accent-green); }
    .badge.SELLER_LISTING { background: rgba(10, 132, 255, 0.18); color: var(--accent-blue); }
    .badge.DIRECTORY { background: rgba(191, 90, 242, 0.18); color: var(--accent-purple); }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      line-height: 1.35;
    }

    .card-title:hover {
      color: var(--accent-blue);
    }

    .card-summary {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-secondary);
      border-top: 1px solid var(--glass-border);
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="macos-window">
    <aside class="sidebar">
      <div>
        <div class="traffic-lights">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
        </div>
        <div class="sidebar-section-label">SurplusOS Streams</div>
        <ul class="nav-list">
          <li class="nav-item active" onclick="setFilter('ALL', this)">
            <span>All Live Feeds</span>
            <span id="total-badge">0</span>
          </li>
          <li class="nav-item" onclick="setFilter('AUCTION_LOT', this)">
            <span>Auction Lots & Bids</span>
          </li>
          <li class="nav-item" onclick="setFilter('SELLER_LISTING', this)">
            <span>Direct Sellers (EXW)</span>
          </li>
          <li class="nav-item" onclick="setFilter('BUYER_LEAD', this)">
            <span>LinkedIn Buyers</span>
          </li>
        </ul>
      </div>

      <div class="telemetry-box">
        <div class="pulse-row">
          <div class="pulse-dot"></div>
          <span id="agent-status">Active</span>
        </div>
        <div>Next Catalog Sync: <strong id="countdown">60s</strong></div>
        <div>Source: <span id="active-source">All Industrial</span></div>
        <div>Last Sync: <span id="last-sync">--:--</span></div>
        <div>Engine: <strong>Ollama (Apple M4)</strong></div>
      </div>
    </aside>

    <main class="main-view">
      <header class="topbar">
        <div class="search-group">
          <input
            type="text"
            id="filter-input"
            class="macos-input"
            placeholder="Filter catalog (e.g. CNC, Transformer, LinkedIn, Chiller)..."
            oninput="fetchCatalog()"
          />
        </div>
        <div class="search-group">
          <input
            type="text"
            id="target-input"
            class="macos-input"
            placeholder="Inject live search target (e.g. 500kVA Generator India)..."
          />
          <button class="macos-btn" onclick="triggerTarget()">Scan Now</button>
        </div>
      </header>

      <section class="catalog-container" id="catalog-grid"></section>
    </main>
  </div>

  <script>
    let currentFilter = "ALL";

    function setFilter(type, el) {
      currentFilter = type;
      document.querySelectorAll(".nav-item").forEach((n) => n.classList.remove("active"));
      el.classList.add("active");
      fetchCatalog();
    }

    async function triggerTarget() {
      const kw = document.getElementById("target-input").value;
      await fetch("/api/target", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ keyword: kw }),
      });
      fetchCatalog();
    }

    async function fetchCatalog() {
      const searchVal = document.getElementById("filter-input").value;
      const res = await fetch(
        `/api/catalog?lead_type=${encodeURIComponent(currentFilter)}&search=${encodeURIComponent(searchVal)}`
      );
      const data = await res.json();

      document.getElementById("total-badge").textContent = data.total_records;
      document.getElementById("agent-status").textContent = data.agent_state.status;
      document.getElementById("countdown").textContent = data.agent_state.next_scan_in_seconds + "s";
      document.getElementById("active-source").textContent = data.agent_state.active_query;
      document.getElementById("last-sync").textContent = data.agent_state.last_scan_utc || "Running initial scan...";

      const grid = document.getElementById("catalog-grid");
      grid.innerHTML = data.items
        .map(
          (item) => `
        <article class="deal-card">
          <div>
            <div class="badge-row">
              <span class="badge ${item.lead_type}">${item.lead_type.replace("_", " ")}</span>
              <span>Urgency: ${item.urgency_score}/100</span>
            </div>
            <div style="margin-top:8px;">
              <a class="card-title" href="${item.url}" target="_blank" rel="noopener noreferrer">
                ${item.title}
              </a>
            </div>
            <p class="card-summary" style="margin-top:6px;">${item.ai_summary}</p>
          </div>
          <div class="meta-grid">
            <div><strong>Asset:</strong> ${item.equipment_category}</div>
            <div><strong>Terms:</strong> ${item.estimated_value_or_terms}</div>
            <div><strong>Entity:</strong> ${item.contact_or_entity}</div>
            <div><strong>Source:</strong> ${item.platform}</div>
          </div>
        </article>
      `
        )
        .join("");
    }

    fetchCatalog();
    setInterval(fetchCatalog, 3000);
  </script>
</body>
</html>
